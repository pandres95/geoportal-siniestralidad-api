# docker-compose.yml
version: "3.9"

services:
  postgres:            # PostgreSQL with PostGIS for testing
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      - POSTGRES_DB=testdb
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  featureserv:         # read-only API on :9000
    image: pramsey/pg_featureserv
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
    ports: ["9000:9000"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
